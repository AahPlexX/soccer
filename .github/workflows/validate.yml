name: Validate main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24.22.1 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          package-manager-cache: false

      - name: Install development tools from the lockfile
        run: npm ci

      - name: Lint for bugs
        run: npm run lint

      - name: Type-check the logic modules
        run: npm run typecheck

      - name: Run behavior and integrity tests
        run: npm test

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find js -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --check sw.js
